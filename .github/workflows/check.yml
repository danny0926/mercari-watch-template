name: Check
on:
  push:
    branches: [main]
    paths-ignore: [seen.json]
  pull_request:
  workflow_dispatch:
    inputs:
      surugaya_probe:
        description: Verify the Japanese storefront from the runner, without private rules or notifications
        type: boolean
        default: false
      taiwan_probe:
        description: Diagnose populated and empty Taiwan searches without notifications
        type: boolean
        default: false
      taiwan_probe_private:
        description: Diagnose Taiwan searches using Secrets; log only counts and loading stages
        type: boolean
        default: false
      state_audit:
        description: Read encrypted history for private reference items without searching, notifying or saving
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ inputs.surugaya_probe && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 5
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
        if: ${{ !inputs.surugaya_probe }}
      - name: Install project-local browser for native probe
        if: ${{ inputs.surugaya_probe }}
        run: python setup-cloakbrowser.py
      - run: python -m unittest -q
        if: ${{ !inputs.surugaya_probe && !inputs.taiwan_probe && !inputs.taiwan_probe_private && !inputs.state_audit }}
      - name: Restore encrypted history for read-only audit
        if: ${{ inputs.state_audit }}
        uses: actions/cache/restore@v4
        with:
          path: .state/seen.enc
          key: Linux-mercari-private-state-v1-audit-${{ github.run_id }}
          restore-keys: Linux-mercari-private-state-v1-
      - name: Audit private reference history
        if: ${{ inputs.state_audit }}
        env:
          MONITOR_STATE_KEY: ${{ secrets.MONITOR_STATE_KEY }}
          MONITOR_AUDIT_JSON: ${{ secrets.MONITOR_AUDIT_JSON }}
        shell: python
        run: |
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          import mercari_watch as app
          try:
              app.SEEN = Path('.state/seen.enc')
              if not app.SEEN.is_file():
                  raise ValueError('History missing')
              references = json.loads(os.environ['MONITOR_AUDIT_JSON'])
              if not isinstance(references, list) or not references:
                  raise ValueError('References missing')
              state = app.load_state()
              for index, reference in enumerate(references):
                  identities = reference['identities']
                  if not isinstance(identities, list) or not identities or not all(isinstance(i, str) for i in identities):
                      raise ValueError('Invalid reference')
                  known = state.get('_known_by_route', {}).get(reference['route'], [])
                  history = state.get(reference['watch_id'], [])
                  receipts = state.get('_notification_receipts', {}).get(reference['route'], {})
                  evidence = sorted({receipts[i].get('evidence') for i in identities if i in receipts and receipts[i].get('evidence') in ('title', 'description', 'review')})
                  reasons = sorted({receipts[i].get('reason') for i in identities if i in receipts and receipts[i].get('reason') in ('live', 'catchup')})
                  print(json.dumps({'reference': index + 1, 'seen_or_baselined': any(i in known for i in identities), 'profile_history_known': any(i in history for i in identities), 'has_delivery_receipt': any(i in receipts for i in identities), 'receipt_evidence': evidence, 'receipt_reasons': reasons, 'has_source_baseline': any(token.startswith(reference['route'] + ':' + reference['watch_id'] + ':') for token in state.get('_baselines', []))}), flush=True)
          except Exception as error:
              raise SystemExit(f'Private history audit failed ({type(error).__name__}); details omitted') from None
      - name: Install Taiwan probe browser
        if: ${{ inputs.taiwan_probe || inputs.taiwan_probe_private }}
        run: python -m playwright install --with-deps chromium
      - name: Diagnose Taiwan storefront access
        if: ${{ inputs.taiwan_probe || inputs.taiwan_probe_private }}
        env:
          WATCHLIST_JSON: ${{ inputs.taiwan_probe_private && secrets.WATCHLIST_JSON || '' }}
          PRIVATE_PROBE: ${{ inputs.taiwan_probe_private }}
        shell: python
        run: |
          import asyncio
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from market_sources import TaiwanSearch
          from mercari_watch import load_watchlist
          async def probe():
              keywords = ['Nintendo Switch', 'zzzz-no-such-native-offer-927419']
              if os.environ['PRIVATE_PROBE'] == 'true':
                  keywords = list(dict.fromkeys(keyword for rule in load_watchlist() if 'tw' in rule.get('sources', ['jp']) for keyword in (rule.get('source_keywords', {}).get('tw', rule.get('keywords', [])) or [rule['keyword']])))
              if not keywords:
                  raise SystemExit('No Taiwan queries configured')
              async with TaiwanSearch() as source:
                  for index, keyword in enumerate(keywords):
                      try:
                          items = await source.search(keyword)
                      except Exception as error:
                          raise SystemExit(f'Taiwan query {index + 1} failed at {source.stage} ({type(error).__name__}); private query omitted') from None
                      if os.environ['PRIVATE_PROBE'] != 'true' and bool(items) != (index == 0):
                          raise SystemExit('Unexpected populated/empty public sample result')
                      print('Verified Taiwan query:', index + 1, 'offers:', len(items), flush=True)
          try:
              asyncio.run(probe())
          except Exception as error:
              raise SystemExit(f'Taiwan probe failed ({type(error).__name__}); private details omitted') from None
      - name: Verify Japanese storefront access
        if: ${{ inputs.surugaya_probe }}
        run: .\.venv\Scripts\python.exe browser_probe.py

